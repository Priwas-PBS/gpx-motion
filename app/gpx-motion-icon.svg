<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">GPX Motion</title>
  <desc id="description">A moving route across stylized terrain</desc>
  <defs>
    <linearGradient id="background" x1="18" y1="112" x2="108" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7800"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="ridge" x1="18" y1="101" x2="108" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#331500" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7a2d00" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6d2500" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#background)"/>
  <path d="M13 99 39 69l16 17 21-32 39 45Z" fill="url(#ridge)"/>
  <path d="M26 96c15-2 12-22 28-24 19-3 11-26 31-30" fill="none" stroke="#14181f" stroke-opacity=".38" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 96c15-2 12-22 28-24 19-3 11-26 31-30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <circle cx="26" cy="96" r="10" fill="#20c96b" stroke="#fff" stroke-width="5"/>
  <path d="m78 29 28 13-28 13Z" fill="#fff" filter="url(#shadow)"/>
</svg>
